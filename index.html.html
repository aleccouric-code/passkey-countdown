<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Microsoft Passkey Rollout Countdown</title>
<style>
  :root {
    --bg1: #0a1628;
    --bg2: #0f2744;
    --accent: #00a4ef;
    --accent2: #7fba00;
    --text: #f0f4f8;
    --muted: #8fa3bf;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  .logo-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
  }
  .sq { width: 18px; height: 18px; border-radius: 2px; }
  .sq1 { background: #f25022; }
  .sq2 { background: #7fba00; }
  .sq3 { background: #00a4ef; }
  .sq4 { background: #ffb900; }
  h1 {
    font-size: 1.7rem;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 36px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  .unit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 8px;
    backdrop-filter: blur(6px);
  }
  .num {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .label {
    margin-top: 8px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
  }
  .target-date {
    font-size: 1rem;
    color: var(--text);
    margin-bottom: 6px;
  }
  .target-date span {
    color: var(--accent2);
    font-weight: 600;
  }
  .status {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(127, 186, 0, 0.15);
    border: 1px solid rgba(127, 186, 0, 0.4);
    color: var(--accent2);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .status.live {
    background: rgba(127, 186, 0, 0.25);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .footer-note {
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .num { font-size: 1.8rem; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <div class="sq sq1"></div><div class="sq sq2"></div><div class="sq sq3"></div><div class="sq sq4"></div>
    </div>
    <h1>Microsoft Passkey Rollout</h1>
    <p class="subtitle">Countdown to org-wide availability</p>

    <div class="grid">
      <div class="unit"><div class="num" id="days">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
    </div>

    <div class="target-date">Target date: <span id="target-label">September 1, 2026</span></div>
    <div id="status-badge" class="status">Counting down</div>

    <p class="footer-note">Tracking toward the 9/1/2026 rollout date. Update the target date in this file if Microsoft revises the timeline.</p>
  </div>

<script>
  const target = new Date("2026-09-01T00:00:00");

  function update() {
    const now = new Date();
    const diff = target - now;

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minsEl = document.getElementById('minutes');
    const secsEl = document.getElementById('seconds');
    const badge = document.getElementById('status-badge');

    if (diff <= 0) {
      daysEl.textContent = "0";
      hoursEl.textContent = "0";
      minsEl.textContent = "0";
      secsEl.textContent = "0";
      badge.textContent = "Rollout day has arrived";
      badge.classList.add('live');
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    daysEl.textContent = days;
    hoursEl.textContent = String(hours).padStart(2, '0');
    minsEl.textContent = String(minutes).padStart(2, '0');
    secsEl.textContent = String(seconds).padStart(2, '0');
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
